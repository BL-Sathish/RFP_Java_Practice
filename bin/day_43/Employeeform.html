<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Payroll Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        header {
            background-color: tomato;
            color: white;
            padding: 1em;
            text-align: center;
            font-size: 1.5em;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .add-user-btn {
            background-color: rgb(105, 128, 0);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .form-container {
            display: none;
            margin-bottom: 20px;
            background: #eef;
            padding: 15px;
            border-radius: 6px;
        }

        .form-container input,
        .form-container select {
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-container button {
            background-color: tomato;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #eee;
        }
    </style>
</head>

<body>
    <header>Employee Payroll App</header>

    <div class="container">
        <button class="add-user-btn" onclick="toggleForm()">+ Add User </button>

        <div class="form-container" id="formContainer">
            <input type="text" id="name" placeholder="Name" required>

            <label for="gender"></label>
            <select id="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <input type="text" id="department" placeholder="Department" required>
            <input type="number" id="salary" placeholder="Salary" required>
            <input type="date" id="startDate" required>
            <button onclick="addEmployee()">Submit</button>
        </div>

        <table id="employeeTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Start Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- New rows will be added here -->
            </tbody>
        </table>
    </div>

    <script>
        function toggleForm() {
            const form = document.getElementById('formContainer');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function addEmployee() {
            const name = document.getElementById('name').value.trim();
            const gender = document.getElementById('gender').value;
            const department = document.getElementById('department').value.trim();
            const salary = document.getElementById('salary').value;
            const startDate = document.getElementById('startDate').value;


            if (!name || !gender || !department || !salary || !startDate) {
                alert("Please fill all fields");
                return;
            }
            if (salary <= 0) {
                alert("Salary must be a positive number");
                return;
            }
            const today = new Date();
            const enteredDate = new Date(startDate);
            if (enteredDate > today) {
                alert("Start Date cannot be in the future");
                return;
            }

            // Add row to table
            const table = document.getElementById('employeeTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();

            newRow.innerHTML = `
        <td>${name}</td>
        <td>${gender}</td>
        <td>${department}</td>
        <td>₹ ${salary}</td>
        <td>${startDate}</td>
      `;

            // Reset form
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('name').value = '';
            document.getElementById('gender').value = '';
            document.getElementById('department').value = '';
            document.getElementById('salary').value = '';
            document.getElementById('startDate').value = '';
        }
    </script>
</body>

</html>
