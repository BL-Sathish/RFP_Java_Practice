<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Employee Payroll App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div id="formId" class="form-content">

    <div class="form-head">Employee Payroll Form</div>

    <!-- UC 2 -->
    <form class="form" action="#" onreset="resetForm()" onsubmit="save()">

      <div class="row-content">
        <label class="label text" for="name">Name</label>
        <input class="input" type="text" id="name" name="name"
               placeholder="Your name..." required/>
        <error-output class="text-error" for="text"></error-output>
      </div>

      <div class="row-content">
        <label class="label text" for="salary">Salary Range</label>
        <select class="input" id="salary" name="salary">
          <option value="">-- Select --</option>
          <option value="10000">₹0 – ₹2,00,000</option>
          <option value="35000">₹2,00,001 – ₹5,00,000</option>
          <option value="75000">₹5,00,001 – ₹10,00,000</option>
          <option value="150000">₹10,00,001 – ₹20,00,000</option>
          <option value="250000">Above ₹20,00,000</option>
        </select>
        <div class="salary-output"></div>
      </div>

      <div class="row-content">
        <label class="label text" for="department">Department</label>
        <select class="input" id="department" name="department">
          <option value="">-- Select --</option>
          <option>HR</option>
          <option>Finance</option>
          <option>Engineering</option>
          <option>Marketing</option>
        </select>
      </div>

      <div class="row-content">
        <label class="label text" for="startDate">Start Date</label>
        <input class="input" type="date" id="startDate" name="startDate"/>
        <error-output class="text-error" for="startDate"></error-output>
      </div>

      <div class="row-content">
        <button type="submit" class="btn">Save</button>
        <button type="reset"  class="btn btn-reset">Reset</button>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
